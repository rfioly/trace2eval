name: publish

# Publishes to PyPI on every GitHub Release using Trusted Publishing (OIDC).
# No API token is stored anywhere -- GitHub exchanges a short-lived identity
# token with PyPI at publish time. The "pypi" environment below must match the
# pending publisher registered on PyPI, or the exchange is refused.

on:
  release:
    types: [published]

jobs:
  publish:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
